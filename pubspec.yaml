name: slm_poc
description: "A new Flutter project."
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  external_path: ^2.2.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  flutter_bloc: ^9.1.1
  http: ^1.5.0
  equatable: ^2.0.7
  dio: ^5.9.0
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.3
  bloc: ^9.1.0

  # ✅ ObjectBox 5.x (recommended for vector DB)
  objectbox: ^5.0.2
  objectbox_flutter_libs: ^5.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Code generation
  build_runner: ^2.4.7
  objectbox_generator: ^5.0.2

# 🚫 No analyzer override needed!
# 🚫 No json_serializable – it breaks ObjectBox

icons_launcher:
  image_path: "assets/icon/icon.png"
  platforms:
    android:
      enable: true
    ios:
      enable: true

flutter:
  uses-material-design: true

  assets:
    - assets/icon/icon.png
    - assets/
    - assets/db/
